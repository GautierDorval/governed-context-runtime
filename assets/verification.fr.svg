<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img" aria-labelledby="title"><title id="title">Portée des vérifications</title><rect x="1" y="1" width="478" height="840" rx="20" fill="#fafaf8" stroke="#ddd9cf"/><text x="24" y="46" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f0f0f">Portée des vérifications</text><rect x="24" y="72" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="103" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">1. Politique de confiance locale</text><text x="42" y="132" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Racine attendue + clé publique de test</text><text x="42" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Obtenues avant la vérification</text><path d="M240 188v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="214" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">2. Reçu de publication</text><text x="42" y="274" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Signature + racine + horloge de test fixe</text><text x="42" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Aucun droit actuel issu de l’historique</text><path d="M240 330v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="356" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="387" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">3. Instantané complet</text><text x="42" y="416" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Octets d’archive + profils déclarés</text><text x="42" y="442" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Identités des packs + références d’unités</text><path d="M240 472v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="498" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="529" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">4. Sources et registre d’unités</text><text x="42" y="558" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Valeurs sources + transformations</text><text x="42" y="584" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Couvertes par l’instantané entier</text><path d="M240 614v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="640" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="671" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">5. Inspection locale</text><text x="42" y="700" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Les deux étapes doivent réussir</text><text x="42" y="726" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Empreinte d’unité v0 isolée insuffisante</text><text x="24" y="795" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f5f5b">L’ancre de confiance de la démo est pédagogique.</text><text x="24" y="819" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f5f5b">L’intégrité n’est pas une vérité sémantique.</text></svg>
