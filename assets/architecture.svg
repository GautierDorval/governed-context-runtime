<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img" aria-labelledby="title"><title id="title">Who does what</title><rect x="1" y="1" width="478" height="840" rx="20" fill="#fafaf8" stroke="#ddd9cf"/><text x="24" y="46" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f0f0f">Who does what</text><rect x="24" y="72" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="103" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">1. Consumer selects</text><text x="42" y="132" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Declared intent + language</text><path d="M240 188v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="214" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">2. Runtime delivers</text><text x="42" y="274" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Precompiled context pack</text><text x="42" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">No free-text intent inference</text><path d="M240 330v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="356" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="387" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">3. Consumer verifies</text><text x="42" y="416" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Pinned snapshot + local policy</text><text x="42" y="442" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Permission stays with the consumer</text><path d="M240 472v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="498" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="529" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">4. Agent responds</text><text x="42" y="558" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Uses the admitted context</text><text x="42" y="584" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">No fidelity guarantee</text><path d="M240 614v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="640" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="671" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">5. External evaluation</text><text x="42" y="700" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Separate model assessment</text><text x="42" y="726" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Outside the runtime kernel</text><text x="24" y="795" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f5f5b">Delivery does not grant authority.</text><text x="24" y="819" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f5f5b">No model is called by this example.</text></svg>
