<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img" aria-labelledby="title"><title id="title">What the checks cover</title><rect x="1" y="1" width="478" height="840" rx="20" fill="#fafaf8" stroke="#ddd9cf"/><text x="24" y="46" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f0f0f">What the checks cover</text><rect x="24" y="72" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="103" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">1. Local trust policy</text><text x="42" y="132" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Expected root + test public key</text><text x="42" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Obtained before verification</text><path d="M240 188v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="214" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">2. Publication receipt</text><text x="42" y="274" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Signature + root + fixed test clock</text><text x="42" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">No current permission from history</text><path d="M240 330v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="356" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="387" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">3. Complete snapshot</text><text x="42" y="416" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Archive bytes + declared profiles</text><text x="42" y="442" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Pack identities + unit references</text><path d="M240 472v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="498" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="529" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">4. Sources and unit registry</text><text x="42" y="558" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Source values + transformations</text><text x="42" y="584" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Covered by the whole snapshot</text><path d="M240 614v20m-6-6 6 6 6-6" fill="none" stroke="#5f5f5b" stroke-width="2"/><rect x="24" y="640" width="432" height="112" rx="12" fill="#fff" stroke="#ddd9cf"/><text x="42" y="671" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f0f0f">5. Local inspection</text><text x="42" y="700" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Both stages must succeed</text><text x="42" y="726" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5b">Isolated v0 unit digest is insufficient</text><text x="24" y="795" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f5f5b">The demo trust anchor is educational.</text><text x="24" y="819" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#5f5f5b">Integrity is not semantic truth.</text></svg>
