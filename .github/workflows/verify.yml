name: public-reference-verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.17.0
      - run: npm test
      - name: Install locked development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - run: npm run test:dev
      - name: Tests leave the worktree unchanged
        run: git status --porcelain --untracked-files=all && test -z "$(git status --porcelain --untracked-files=all)"
